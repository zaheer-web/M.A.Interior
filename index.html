<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         BASIC SEO
    ========================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <!-- Website Title -->
    <title>
      M.A. Architects & Associates | Architecture, Urban Design & Planning
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="M.A. Architects & Associates is a multidisciplinary architectural practice delivering thoughtful, functional and timeless architectural, urban design and planning solutions for residential, commercial, institutional, hospitality and healthcare projects."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="M.A. Architects & Associates, architecture firm, architect, architects in Delhi, architecture design, urban design, urban planning, architectural consultancy, residential architecture, commercial architecture, institutional architecture, hospitality architecture, healthcare architecture, interior design"
    />

    <meta
      name="author"
      content="M.A. Architects & Associates"
    />

    <meta
      name="publisher"
      content="M.A. Architects & Associates"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <meta
      name="bingbot"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://yourdomain.com/"
    />


    <!-- =========================================
         FAVICON / BRAND ICON
    ========================================== -->

    <!-- Main browser favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/MA_logo1.png"
    />

    <!-- Shortcut icon -->
    <link
      rel="shortcut icon"
      type="image/png"
      href="/MA_logo1.png"
    />

    <!-- Apple / iPhone / iPad -->
    <link
      rel="apple-touch-icon"
      href="/MA_logo1.png"
    />

    <!-- Mobile / Android -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/MA_logo1.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/MA_logo1.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="/site.webmanifest"
    />


    <!-- =========================================
         OPEN GRAPH / FACEBOOK / WHATSAPP / LINKEDIN
    ========================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="M.A. Architects & Associates | Architecture & Urban Design"
    />

    <meta
      property="og:description"
      content="Thoughtful, functional and timeless architecture, urban design and planning solutions by M.A. Architects & Associates."
    />

    <meta
      property="og:image"
      content="/MA_logo1.png"
    />

    <meta
      property="og:image:alt"
      content="M.A. Architects & Associates"
    />

    <meta
      property="og:site_name"
      content="M.A. Architects & Associates"
    />

    <meta
      property="og:url"
      content="https://yourdomain.com/"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />


    <!-- =========================================
         TWITTER / X CARD
    ========================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="M.A. Architects & Associates | Architecture & Urban Design"
    />

    <meta
      name="twitter:description"
      content="Architecture, urban design, planning and multidisciplinary design solutions by M.A. Architects & Associates."
    />

    <meta
      name="twitter:image"
      content="/MA_logo1.png"
    />

    <meta
      name="twitter:image:alt"
      content="M.A. Architects & Associates"
    />


    <!-- =========================================
         GOOGLE / SEARCH ENGINE HINTS
    ========================================== -->

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="M.A. Architects"
    />


    <!-- =========================================
         FONTS
    ========================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />


    <!-- =========================================
         STRUCTURED DATA / ORGANIZATION
    ========================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ArchitecturalBusiness",
        "name": "M.A. Architects & Associates",
        "url": "https://yourdomain.com/",
        "logo": "https://yourdomain.com/MA_logo1.png",
        "description": "M.A. Architects & Associates is a multidisciplinary architectural practice providing architecture, urban design, planning and design consultancy services.",
        "image": "https://yourdomain.com/MA_logo1.png",
        "sameAs": []
      }
    </script>

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
